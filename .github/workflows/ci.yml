name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: test
          - os: windows-latest
            name: test-windows
    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4
      - name: Instalar o uv
        uses: astral-sh/setup-uv@v7
      - name: Configurar o Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências pelo lockfile
        run: uv sync --frozen
      - name: Executar o Ruff
        run: uv run ruff check .
      - name: Executar os testes
        run: uv run pytest
      - name: Validar whitespace do diff
        run: git diff --check
